; PlatformIO - ESP32 donnees (capteurs, BMS, energie, CAN, liaison UART Pi)
; https://docs.platformio.org/page/projectconf.html
;
; Deux cartes, un seul code. Choisir l'environnement dans la barre du bas
; de VS Code (ou : pio run -e wroom32e / pio run -e s3).

[platformio]
default_envs = s3

; --- Reglages communs a toutes les cartes ---
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
; Librairies partagees en C (protocole UART) : 2026-2027/shared/c
lib_extra_dirs = ../../shared/c

; --- Carte provisoire : ESP32-WROOM-32E sur DevKit ---
[env:wroom32e]
board = esp32dev
build_flags = -DCARTE_WROOM32E

; --- Tests du protocole executes SUR l'ESP32 (WROOM-32E) ---
; Flasher cet environnement, puis lire le resultat dans le moniteur serie.
; Reflasher ensuite "wroom32e" pour retrouver le firmware normal.
[env:tests_wroom32e]
board = esp32dev
build_flags = -DCARTE_WROOM32E
build_src_filter = -<*> +<../tests_esp/>

; --- Carte finale : ESP32-S3 DevKitC-1 ---
; Selon la reference gravee sur le module (N8, N16R8...), il faudra
; peut-etre ajouter la taille de flash et la PSRAM ici.
[env:s3]
board = esp32-s3-devkitc-1
build_flags = -DCARTE_S3
