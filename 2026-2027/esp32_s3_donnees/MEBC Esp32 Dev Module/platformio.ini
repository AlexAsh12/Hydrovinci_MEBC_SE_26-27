; PlatformIO - ESP32 donnees (capteurs, BMS, energie, CAN, liaison UART Pi)
; https://docs.platformio.org/page/projectconf.html
;
; Deux cartes, un seul code. Choisir l'environnement dans la barre du bas
; de VS Code (ou : pio run -e wroom32e / pio run -e s3).

[platformio]
default_envs = wroom32e

; --- Reglages communs a toutes les cartes ---
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
; Librairies partagees (protocole UART) : 2026-2027/shared/esp
lib_extra_dirs = ../../shared/esp

; --- Carte provisoire : ESP32-WROOM-32E sur DevKit ---
[env:wroom32e]
board = esp32dev
build_flags = -DCARTE_WROOM32E

; --- Carte finale : ESP32-S3 DevKitC-1 ---
; Selon la reference gravee sur le module (N8, N16R8...), il faudra
; peut-etre ajouter la taille de flash et la PSRAM ici.
[env:s3]
board = esp32-s3-devkitc-1
build_flags = -DCARTE_S3
