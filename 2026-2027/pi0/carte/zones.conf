# Zones de navigation dont la carte (Plan IGN) est stockee sur la Pi.
# Seules ces portions sont telechargees : ailleurs, la carte montre une grille.
#
# Une ligne par rectangle (plusieurs rectangles possibles pour une zone) :
#   nom  lat_sud  lat_nord  lon_ouest  lon_est  zoom_min  zoom_max
# Degres decimaux, longitude negative a l'ouest de Greenwich.
# Zoom 14 : vue d'ensemble (~10 m par pixel) ; zoom 16 : detail (~1,5 m par
# pixel). Un zoom de plus = 4 fois plus de tuiles : garder le zoom 16 pour
# l'eau et les quais.
#
# Ajouter une zone : une ligne ici, puis sur la Pi (ou un PC Linux) :
#   cd 2026-2027/pi0 && make telecharger_carte && ./telecharger_carte

# Monaco : port Hercule, Fontvieille et zone de course MEBC (surtout la mer, leger)
monaco    43.7180 43.7450 7.4050 7.4450 13 16

# Nanterre : vue d'ensemble de la Seine entre Rueil et Bezons...
nanterre  48.8850 48.9300 2.1550 2.2250 13 14
# ... et detail le long du fleuve seulement
nanterre  48.8850 48.9030 2.1550 2.1850 15 16   # Rueil, ile de Chatou
nanterre  48.8950 48.9150 2.1750 2.2100 15 16   # ile Fleurie, chemin de l'Ile
nanterre  48.9100 48.9300 2.2000 2.2250 15 16   # ile Saint-Martin, Bezons
